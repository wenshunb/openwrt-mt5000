name: Build MT5000 experimental firmware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mt5000-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 996b7d3833d3e047c3df3bb6f0df586a483a12b2

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out build recipe
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check out reviewed MT5000 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: GLiNet-Tech/openwrt
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false

      - name: Prepare Ubuntu build environment
        run: |
          # These are unused preinstalled SDKs on this disposable hosted runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates bzip2 xz-utils zstd patch time \
            libelf-dev libzstd-dev liblz4-dev
          df -h .
          free -h

      - name: Configure source and feeds
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git apply --check ../patches/0001-mt5000-preserve-sysupgrade-config.patch
          git apply ../patches/0001-mt5000-preserve-sysupgrade-config.patch
          cp ../configs/feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../configs/mt5000.config .config
          make defconfig
          for symbol in \
            TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000 \
            PACKAGE_luci-ssl PACKAGE_kmod-wireguard PACKAGE_kmod-usb3 \
            PACKAGE_kmod-inet-diag PACKAGE_kmod-tun; do
            grep -qx "CONFIG_${symbol}=y" .config
          done
          ./scripts/diffconfig.sh > config.seed
          ./scripts/feeds list -s > feeds.buildinfo
          git diff > applied.patch
          git rev-parse HEAD > source.commit

      - name: Restore host tools and cross toolchain
        id: toolchain-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            source/staging_dir/host
            source/staging_dir/toolchain-*
            source/build_dir/host
            source/build_dir/toolchain-*
          key: toolchain-${{ runner.os }}-${{ env.SOURCE_SHA }}-${{ hashFiles('configs/mt5000.config', 'configs/feeds.conf') }}

      - name: Restore downloaded package sources
        id: dl-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: source/dl
          key: dl-${{ env.SOURCE_SHA }}-${{ hashFiles('configs/mt5000.config', 'configs/feeds.conf') }}
          restore-keys: |
            dl-${{ env.SOURCE_SHA }}-
            dl-

      - name: Download verified package sources
        working-directory: source
        run: make download -j8 V=s 2>&1 | tee download.log

      - name: Save downloaded package sources
        if: steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: source/dl
          key: dl-${{ env.SOURCE_SHA }}-${{ hashFiles('configs/mt5000.config', 'configs/feeds.conf') }}

      - name: Build host tools and cross toolchain
        id: toolchain-build
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: source
        run: make -j"$(nproc)" tools/install toolchain/install 2>&1 | tee toolchain.log

      - name: Save host tools and cross toolchain
        if: steps.toolchain-build.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            source/staging_dir/host
            source/staging_dir/toolchain-*
            source/build_dir/host
            source/build_dir/toolchain-*
          key: toolchain-${{ runner.os }}-${{ env.SOURCE_SHA }}-${{ hashFiles('configs/mt5000.config', 'configs/feeds.conf') }}

      - name: Trust restored toolchain
        if: steps.toolchain-cache.outputs.cache-hit == 'true'
        working-directory: source
        run: |
          # Checkout gives every source file a fresh mtime, so drop the tools and
          # toolchain stamp prerequisites to stop make rebuilding what we restored.
          rm -rf tmp
          sed -i 's/ $(tool.*\/stamp-compile)//;' Makefile
          git diff --stat Makefile

      - name: Build complete firmware
        working-directory: source
        run: |
          if make -j"$(nproc)" 2>&1 | tee build.log; then
            exit 0
          fi
          echo "Parallel build failed; replaying serially for a diagnosable log."
          make -j1 V=s 2>&1 | tee -a build.log

      - name: Validate and collect firmware
        working-directory: source
        run: |
          python3 ../scripts/collect-firmware.py
          cp config.seed feeds.buildinfo source.commit applied.patch ../artifacts/
          cp .config ../artifacts/build.config

      - name: Upload firmware and build records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mt5000-experimental-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mt5000-logs-${{ github.run_number }}
          path: |
            source/build.log
            source/download.log
            source/toolchain.log
            source/logs/
            source/config.seed
            source/feeds.buildinfo
          if-no-files-found: warn
          retention-days: 14
