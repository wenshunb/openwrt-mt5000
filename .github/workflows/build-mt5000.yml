name: Build MT5000 experimental firmware

on:
  workflow_dispatch:
    inputs:
      custom_packages:
        description: Extra OpenWrt package names for the custom firmware, separated by spaces
        required: true
        type: string
        default: 'ddns-scripts ddns-scripts-cloudflare luci-app-ddns luci-app-upnp luci-app-wol sing-box'

permissions:
  contents: read

concurrency:
  group: mt5000-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 1713e8be63b628fe2f1d336f4fb3a8aa152875af
  TOOLCHAIN_CACHE_PATHS: |
    source/staging_dir/host
    source/staging_dir/toolchain-*
    source/build_dir/host
    source/build_dir/toolchain-*

jobs:
  toolchain:
    name: Prepare shared toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      cache_key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
    defaults: &bash-defaults
      run:
        shell: bash
    steps:
      - &checkout-recipe
        name: Check out build recipe
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Look up shared toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          lookup-only: true
          path: ${{ env.TOOLCHAIN_CACHE_PATHS }}
          key: toolchain-ubuntu24-v2-${{ runner.arch }}-${{ env.SOURCE_SHA }}-${{ hashFiles('configs/mt5000.config', 'configs/feeds.conf', 'scripts/prepare-build.sh') }}

      - name: Check out reviewed MT5000 source
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: &source-checkout
          repository: GLiNet-Tech/openwrt
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false

      - name: Prepare base build environment and configuration
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: bash scripts/prepare-build.sh base

      - name: Restore toolchain from previous builds of this source
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.TOOLCHAIN_CACHE_PATHS }}
          key: toolchain-${{ runner.os }}-${{ env.SOURCE_SHA }}

      - name: Restore shared source downloads
        id: dl-cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: source/dl
          key: dl-${{ env.SOURCE_SHA }}-base-${{ hashFiles('source/config.seed', 'configs/feeds.conf') }}
          restore-keys: |
            dl-${{ env.SOURCE_SHA }}-base-
            dl-${{ env.SOURCE_SHA }}-
            dl-

      - name: Download common package sources
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: source
        run: make download -j8 V=s 2>&1 | tee download.log

      - name: Save shared source downloads
        if: steps.dl-cache.outcome == 'success' && steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: source/dl
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      - name: Build host tools and cross toolchain
        id: build
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: source
        run: make -j"$(nproc)" tools/install toolchain/install 2>&1 | tee toolchain.log

      - name: Save shared toolchain
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.TOOLCHAIN_CACHE_PATHS }}
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Upload toolchain logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mt5000-toolchain-logs-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            source/download.log
            source/toolchain.log
            source/config.seed
            source/feeds.buildinfo
          if-no-files-found: warn
          retention-days: 14

  firmware:
    name: Build ${{ matrix.profile }} firmware
    needs: toolchain
    strategy:
      fail-fast: false
      matrix:
        profile: [base, custom]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults: *bash-defaults
    steps:
      - *checkout-recipe

      - name: Check out reviewed MT5000 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: *source-checkout

      - name: Prepare build environment and profile configuration
        env:
          PROFILE: ${{ matrix.profile }}
          CUSTOM_PACKAGES: ${{ format('ip-full kmod-dummy kmod-nft-socket kmod-nft-tproxy {0}', inputs.custom_packages) }}
        run: |
          bash scripts/prepare-build.sh "$PROFILE"
          if [[ "$PROFILE" == custom ]] && grep -Eq '^CONFIG_PACKAGE_ip-tiny=[ym]$' source/.config; then
            echo 'The custom firmware requires ip-full in place of ip-tiny.' >&2
            exit 1
          fi

      - name: Restore host tools and cross toolchain
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.TOOLCHAIN_CACHE_PATHS }}
          key: ${{ needs.toolchain.outputs.cache_key }}

      - name: Restore downloaded package sources
        id: dl-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: source/dl
          key: dl-${{ env.SOURCE_SHA }}-${{ matrix.profile }}-${{ hashFiles('source/config.seed', 'configs/feeds.conf') }}
          restore-keys: |
            dl-${{ env.SOURCE_SHA }}-${{ matrix.profile }}-
            ${{ matrix.profile == 'custom' && format('dl-{0}-base-', env.SOURCE_SHA) || '' }}
            dl-${{ env.SOURCE_SHA }}-
            dl-

      - name: Download verified package sources
        working-directory: source
        run: make download -j8 V=s 2>&1 | tee download.log

      - name: Save downloaded package sources
        if: steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: source/dl
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      - name: Build complete firmware
        working-directory: source
        run: |
          if make -j"$(nproc)" 2>&1 | tee build.log; then
            exit 0
          fi
          echo "Parallel build failed; replaying serially for a diagnosable log."
          make -j1 V=s 2>&1 | tee -a build.log

      - name: Validate and collect firmware
        working-directory: source
        run: |
          python3 ../scripts/collect-firmware.py
          cp config.seed feeds.buildinfo source.commit ../artifacts/
          cp .config ../artifacts/build.config

      - name: Upload firmware and build records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mt5000-${{ matrix.profile }}-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mt5000-${{ matrix.profile }}-logs-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            source/build.log
            source/download.log
            source/logs/
            source/config.seed
            source/feeds.buildinfo
          if-no-files-found: warn
          retention-days: 14
